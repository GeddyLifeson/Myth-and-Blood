name: Lint, format & tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript
        run: npm run build:ts
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Manifest and globals in sync
        run: node scripts/check-manifest-sync.mjs && node scripts/check-eslint-globals.mjs
      - name: Tests
        run: node scripts/run-all-tests.mjs --skip-sim
      # A bot plays without cheats; fails if the game throws or a wave never ends.
      - name: Honest playtest (short)
        run: node scripts/sim-honest-play.mjs
        env:
          HONEST_TICKS: '15000'
          HONEST_SEEDS: '2'
      - name: Build
        run: npm run build:all
